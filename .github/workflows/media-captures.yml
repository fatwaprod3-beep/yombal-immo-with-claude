name: media-captures
on:
  push:
    branches: [media-captures]
    paths: ['media/**','.github/workflows/media-captures.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: |
          cd media && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node capture.js
      - run: |
          git config user.name "yombal-bot" && git config user.email "bot@yombal.local"
          git add media/captures && git commit -m "captures [skip ci]" && git push
